# Thin wrapper over scripts/gate.sh. This public repository keeps its own CI (ADR-0014, which
# amends ADR-0009).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # GitHub-hosted, never self-hosted: this repository is meant to go public, and a fork's pull
    # request must not run on a self-hosted runner (ADR-0014).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4" # the gate fails if this differs from .terraform-version
          terraform_wrapper: false
      - name: Install pinned, checksum-verified tools
        run: |
          bash scripts/install-tools.sh "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Gate
        env:
          # tflint --init downloads its rulesets from GitHub's API. Unauthenticated, that shares the
          # runner IP's 60 requests per hour and failed the wave 1 PR with a 403. The workflow token
          # is read-only (permissions: contents: read) and authenticates the download.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/gate.sh
